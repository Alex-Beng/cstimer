name: Deploy to Github Pages

on:
  push:
    branches: ["**"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup java
        uses: actions/setup-java@v4.0.0
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup php
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.0'

      - name: Build all branches
        run: |
          mkdir -p dist/pages
          BRANCHES=$(git branch -r | grep -v '\->' | sed 's|origin/||' | tr -d ' ')
          for BRANCH in $BRANCHES; do
            echo "Building branch: $BRANCH"
            git checkout "$BRANCH"
            rm -rf dist/local dist/js dist/css dist/lang
            mkdir -p dist/local/js dist/local/css
            make local
            if [ "$BRANCH" = "master" ]; then
              cp -r dist/local/. dist/pages/
            else
              SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
              mkdir -p "dist/pages/${SAFE_BRANCH}"
              cp -r dist/local/. "dist/pages/${SAFE_BRANCH}/"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

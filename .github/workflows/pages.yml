name: Deploy to Github Pages

on:
  push:
    branches: ["master", "moyu", "feat/cube-copilot"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup php
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.0'

      # master is published at the site root using the minified build
      # (`make local`).  Every other branch is published under a subdirectory
      # built straight from sources (`make src_local`), so e.g.
      # feat/cube-copilot is reachable at /feat-cube-copilot/.
      - name: Build all branches
        run: |
          set -e
          mkdir -p dist/pages
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          BRANCHES="master moyu feat/cube-copilot"
          for BRANCH in $BRANCHES; do
            if ! git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
              echo "Skipping missing branch: $BRANCH"
              continue
            fi
            echo "::group::Building branch: $BRANCH"
            git checkout -f --detach "origin/$BRANCH"
            rm -rf dist/local
            if [ "$BRANCH" = "master" ]; then
              make local
              cp -r dist/local/. dist/pages/
            else
              make src_local
              SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
              mkdir -p "dist/pages/${SAFE_BRANCH}"
              cp -r dist/local/. "dist/pages/${SAFE_BRANCH}/"
            fi
            echo "::endgroup::"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
